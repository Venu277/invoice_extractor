<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip -->
    <clipPath id="lockup-squircle-clip">
      <rect x="4" y="4" width="40" height="40" rx="10" ry="10"/>
    </clipPath>

    <!-- Liquid Glass Tile Gradient in Sky Blue -->
    <linearGradient id="lockup-tile-gradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glass Rim -->
    <linearGradient id="lockup-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Tile (40x40) -->
  <g>
    <!-- Base Squircle -->
    <rect x="4" y="4" width="40" height="40" rx="10" ry="10" fill="url(#lockup-tile-gradient)"/>

    <g clip-path="url(#lockup-squircle-clip)">
      <!-- Top Specular Flare -->
      <ellipse cx="24" cy="2" rx="22" ry="14" fill="#ffffff" fill-opacity="0.30"/>

      <!-- Letter A Shadow -->
      <path d="M 24,11 L 33,33 C 33.3,33.7 32.8,34.5 32,34.5 L 29,34.5 C 28.4,34.5 27.9,34.1 27.7,33.5 L 25.8,28.8 L 22.2,28.8 L 20.3,33.5 C 20.1,34.1 19.6,34.5 19,34.5 L 16,34.5 C 15.2,34.5 14.7,33.7 15,33 L 24,11 Z M 24,19.2 L 23.1,24.8 L 24.9,24.8 L 24,19.2 Z"
            fill="#0369a1" fill-opacity="0.6" transform="translate(0, 1)"/>

      <!-- Letter A Glyph -->
      <path d="M 24,11 L 33,33 C 33.3,33.7 32.8,34.5 32,34.5 L 29,34.5 C 28.4,34.5 27.9,34.1 27.7,33.5 L 25.8,28.8 L 22.2,28.8 L 20.3,33.5 C 20.1,34.1 19.6,34.5 19,34.5 L 16,34.5 C 15.2,34.5 14.7,33.7 15,33 L 24,11 Z M 24,19.2 L 23.1,24.8 L 24.9,24.8 L 24,19.2 Z"
            fill="#ffffff"/>
    </g>

    <!-- Glass Rim Stroke -->
    <rect x="4" y="4" width="40" height="40" rx="10" ry="10" fill="none" stroke="url(#lockup-rim)" stroke-width="1"/>
  </g>

  <!-- Wordmark Text in Deep Midnight Ink (#0b0c2b) for Light Mode -->
  <text x="56" y="32"
        fill="#0b0c2b"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="24"
        font-weight="600"
        letter-spacing="-0.025em">Axion</text>
</svg>
