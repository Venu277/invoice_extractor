<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow Under Tile -->
    <filter id="tile-shadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.20"/>
    </filter>

    <!-- Squircle Path Definition -->
    <clipPath id="squircle-clip">
      <path d="M 512,256 C 512,388 506,444 446,488 C 392,512 336,512 256,512 C 176,512 120,512 66,488 C 6,444 0,388 0,256 C 0,124 6,68 66,24 C 120,0 176,0 256,0 C 336,0 392,0 446,24 C 506,68 512,124 512,256 Z"/>
    </clipPath>

    <!-- Rich Apple Liquid-Glass Diagonal Gradient in Vibrant Sky Blue -->
    <linearGradient id="tile-gradient" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="38%" stop-color="#0ea5e9"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Top-Left Radial Specular Glow -->
    <radialGradient id="top-glow" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Bottom Shadow for Glass Depth -->
    <linearGradient id="inner-bottom-shadow" x1="50%" y1="65%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Glass Rim Stroke Gradient -->
    <linearGradient id="glass-rim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Frosted Glyph Gradient -->
    <linearGradient id="glyph-gradient" x1="30%" y1="15%" x2="70%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.99"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Glyph Shadow Filter for Refractive Thickness -->
    <filter id="glyph-depth" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#075985" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#tile-shadow)">
    <!-- Base Squircle with Gradient -->
    <path d="M 512,256 C 512,388 506,444 446,488 C 392,512 336,512 256,512 C 176,512 120,512 66,488 C 6,444 0,388 0,256 C 0,124 6,68 66,24 C 120,0 176,0 256,0 C 336,0 392,0 446,24 C 506,68 512,124 512,256 Z"
          fill="url(#tile-gradient)"/>

    <!-- Clipped Overlays (Top Glow & Bottom Depth) -->
    <g clip-path="url(#squircle-clip)">
      <rect x="0" y="0" width="512" height="512" fill="url(#top-glow)"/>
      <rect x="0" y="0" width="512" height="512" fill="url(#inner-bottom-shadow)"/>

      <!-- Liquid Glass Lens Flare Arc -->
      <ellipse cx="256" cy="-40" rx="270" ry="210" fill="#ffffff" fill-opacity="0.15"/>

      <!-- Geometric Letter A Depth Shadow -->
      <g filter="url(#glyph-depth)" transform="translate(0, 4)">
        <path d="M 256,104 L 388,382 C 392,391 386,400 376,400 L 332,400 C 324,400 318,395 315,388 L 290,326 L 222,326 L 197,388 C 194,395 188,400 180,400 L 136,400 C 126,400 120,391 124,382 L 256,104 Z M 256,204 L 235,274 L 277,274 L 256,204 Z"
              fill="#0369a1" fill-opacity="0.65"/>
      </g>

      <!-- Liquid Glass Geometric Letter A Main Glyph -->
      <path d="M 256,104 L 388,382 C 392,391 386,400 376,400 L 332,400 C 324,400 318,395 315,388 L 290,326 L 222,326 L 197,388 C 194,395 188,400 180,400 L 136,400 C 126,400 120,391 124,382 L 256,104 Z M 256,204 L 235,274 L 277,274 L 256,204 Z"
            fill="url(#glyph-gradient)"/>

      <!-- Specular Highlight on Apex & Left Leg of Glyph -->
      <path d="M 256,104 L 124,382 C 120,391 126,400 136,400 L 148,400 L 256,118 L 272,154 L 268,142 Z"
            fill="#ffffff" fill-opacity="0.65"/>
    </g>

    <!-- Glass Rim Perimeter Stroke -->
    <path d="M 512,256 C 512,388 506,444 446,488 C 392,512 336,512 256,512 C 176,512 120,512 66,488 C 6,444 0,388 0,256 C 0,124 6,68 66,24 C 120,0 176,0 256,0 C 336,0 392,0 446,24 C 506,68 512,124 512,256 Z"
          fill="none" stroke="url(#glass-rim)" stroke-width="2.5"/>
  </g>
</svg>
